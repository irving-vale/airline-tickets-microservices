server:
  port: 8083

spring:
  application:
    name: msvc-users

  # Base de Datos y JPA (Se inyecta por variables/perfiles)
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Configuración de Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true
    clean-disabled: true
    validate-on-migrate: true

  # Desactiva la auto-gestión de Docker Compose desde Spring Boot
  docker:
    compose:
      enabled: false

# ============================================================
# 📊 ACTUATOR & HEALTH (Requerido para Kubernetes/Docker)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: 'health,info,prometheus,metrics'
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      diskspace:
        enabled: true
  info:
    os:
      enabled: true

# ============================================================
# 🏷️ EUREKA CLIENT
# ============================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ============================================================
# 📝 LOGGING (Sin rastros de Zipkin ni trazas vacías)
# ============================================================
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([${spring.application.name:}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"