### Configuration DB ###
spring.application.name=CursoSpringBoot-DEV
spring.datasource.url=jdbc:postgresql://localhost:5431/db_users
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD_USER}

### Configuration HikariCP Pool of connections###
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10


